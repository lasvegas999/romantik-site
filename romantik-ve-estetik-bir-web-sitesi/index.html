<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benimle çıkar mısın?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-live="polite">
      <section class="card" id="mainCard">
        <section class="name-gate" id="nameGate">
          <p class="eyebrow">Önce küçük bir şey</p>
          <h1>Sitenin çalışması için isim girmek zorunludur</h1>
          <form id="nameForm" class="name-form">
            <input id="nameInput" type="text" placeholder="İsmin" maxlength="40" required />
            <button class="button button-yes" type="submit">Devam et</button>
          </form>
        </section>

        <section class="question-stage" id="questionStage" hidden>
          <p class="eyebrow">Sana küçük bir soru</p>
          <h1 id="headline">Benimle çıkar mısın? 🖤</h1>

          <div class="actions" id="actions">
            <button class="button button-yes" id="yesButton" type="button">Evet</button>
            <button class="button button-no" id="noButton" type="button">Hayır</button>
          </div>
        </section>

        <div class="bouquet-wrap" id="bouquetWrap" aria-hidden="true">
          <img src="buket.png" alt="Romantik buket" class="bouquet" />
          <p class="final-message">Artık kaçışın yok 😌🖤</p>
        </div>

        <div class="sad-wrap" id="sadWrap" aria-hidden="true">
          <img src="uzgun.png" alt="Üzgün fotoğraf" class="sad-image" />
          <p class="sad-message">Peki öyle olsun...</p>
        </div>
      </section>
    </main>

    <footer class="signature">Vega tarafından yapılmıştır</footer>

    <audio id="dramaticAudio" src="dramatik.mp3" preload="auto"></audio>
    <script src="script.js"></script>
  </body>
</html>
